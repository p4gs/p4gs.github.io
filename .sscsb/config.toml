# SSCS Bootstrapper configuration — the single source of truth for which
# controls are enabled. Every control is independently toggleable here;
# no code changes required. Secure defaults are ON; optional integrations
# that need external services or extra tooling are OFF.
#
# Toggle:   sscsb enable <control> | sscsb disable <control>
# Inspect:  sscsb status | sscsb verify | sscsb report

[general]
# Branches where human-only signing and merge policy are enforced.
# "master" dropped from the default list: this repo has only `main`; listing a
# nonexistent branch makes branch-protection verification fail on a ghost.
protected_branches = ["main"]
# fail_open = true would let hooks pass when scanners are missing. Keep false.
fail_open = false
github_repo = "p4gs/p4gs.github.io"

# ── Phase 1 — Local source integrity ──

# Secret scanning hooks: TruffleHog + Gitleaks block secrets at pre-commit and pre-push
[controls.secrets]
enabled = true
trufflehog = true
gitleaks = true
pre_push_range_scan = true

# CommitSigningGuard: human-only signing enforced on protected branches at pre-push.
# require_hardware_backed relaxed (owner decision 2026-08-09, applies to all repos)
# to admit the owner's 1Password-vaulted SSH key (software-backed, not a physical
# security key) — 1Password is the standing SSH-signing-key store going forward.
[controls.commit-signing]
enabled = true
require_hardware_backed = false
require_review_evidence_for_ai_merges = true

# AI agent commit signing: Verifiable AI-agent signatures (distinct identity, never valid on protected branches); off by default
[controls.agent-signing]
enabled = false
require_agent_signatures = false
allowed_backends = ["github-app", "tpm", "fido2", "kms", "piv", "software"]
max_key_age_days = 90

# Five-environment signing model: Machine-wide signing posture: human enclave lane, distinct agent identity, cloud/web/Codespaces guidance
[controls.signing-model]
enabled = true

# Branch protection verification: Verify GitHub protected-branch rules (PRs, no force-push, signatures, checks)
[controls.branch-protection]
enabled = true

# Actions pinning & permissions audit: Flag mutable action refs and missing/over-broad workflow permissions
[controls.actions-audit]
enabled = true

# gittuf ref protection: Signed, forge-independent policy over who may change which git refs, verified in CI; off by default (advanced)
[controls.gittuf]
enabled = false

# AI commit trailers: Validate AI-Assisted / AI-Tool / AI-Model / AI-Role commit trailers
[controls.ai-trailers]
enabled = true

# AI dependency & command gate: Extra gating when AI-assisted commits add dependencies or shell commands
[controls.ai-dep-gate]
enabled = true

# AI-provenance PR template: PR template asking whether AI generated code/tests/dependencies/docs
[controls.pr-template]
enabled = true

# AI provenance receipts: Optional cryptographic receipts linking commits to AI tool/model/role
# Enabled (default off): AI agents do real work in this repo (this bootstrap
# included), so commits carry cryptographic receipts; sign_with_cosign = true
# mirrors sscs-bootstrapper's own dogfooding posture.
[controls.ai-receipts]
enabled = true
sign_with_cosign = true
cosign_identity = ""
cosign_issuer = "https://token.actions.githubusercontent.com"

# ── Phase 2 — Dependency & vulnerability visibility ──

# SBOM generation: Syft SBOM in CycloneDX (default) or SPDX JSON
[controls.sbom]
enabled = true
format = "cyclonedx-json"

# Vulnerability scanning: Trivy (vuln+secret+misconfig) and OSV-Scanner V2 (lockfile-exact)
[controls.vuln-scan]
enabled = true
fail_on = "high"

# OpenSSF Scorecard: Scorecard workflow scoring repository security posture
[controls.scorecard]
enabled = true

# Renovate onboarding: Automated dependency updates with digest pinning + lockfile maintenance
[controls.renovate]
enabled = true

# Package trust gate: Existence validation, human approval for new packages, typosquat heuristics, lockfile-exact installs
[controls.package-trust]
enabled = true
registry_check = true
typosquat_check = true

# Bumblebee endpoint exposure scan: Inventory installed packages, MCP servers, editor/browser extensions and agent skills; match against known-compromise catalogs
# Enabled (default off): the development environment for this repo runs AI agents,
# MCP servers, and editor extensions — exactly the endpoint exposure bumblebee
# inventories against known-compromise catalogs.
[controls.bumblebee]
enabled = true
profile = "baseline"
catalog = ""

# Grype (optional): SBOM-first vulnerability scanning where Syft+Grype is preferred
# Enabled (default off): grype is installed on this machine; adds SBOM-first
# vulnerability coverage on top of Trivy + OSV-Scanner at zero extra cost.
[controls.grype]
enabled = true

# Socket Firewall (optional): Malicious-package detection/blocking at install time
# Enabled (default off): the Socket GitHub App is already installed on this repo
# (its PR checks run here) and the sfw CLI is present on the dev machine —
# wrap installs as `sfw bun install` / `sfw npm install`.
[controls.socket-firewall]
enabled = true

# ── Phase 3 — Provenance, signing & credential federation ──

# This repo has no GitHub releases: its deploy IS its release. The artifact
# that ships is the Pages deployment, packed by .github/workflows/pages.yml
# into one file (site.tar.gz) with one digest, and the four provenance
# controls below all bind to that digest inside that workflow (consolidated
# evidence, not the modular release-*.yml templates, which assume tags).

# Sigstore keyless signing: Cosign keyless signing + SBOM/provenance attestations bound to digests
# Implemented in pages.yml `attest` job: sigstore/cosign-installer +
# `cosign sign-blob site.tar.gz --bundle site.tar.gz.sigstore.json --yes`
# under id-token: write; the bundle ships as the `site-signature` run artifact
# and deploy-gate.yml verifies it (anchored identity = pages.yml@refs/heads/main).
[controls.sigstore-signing]
enabled = true

# SLSA Build L3 provenance: slsa-github-generator reusable workflow (tag-pinned per its trust model)
# Implemented in pages.yml `provenance` job: generator_generic_slsa3.yml@v2.1.0
# over site.tar.gz's sha256 (upload-assets: false — no release to attach to;
# the provenance is a run artifact deploy-gate.yml downloads and verifies).
[controls.slsa-provenance]
enabled = true

# GitHub artifact attestations: GitHub-native build provenance (attest-build-provenance) — additive to Cosign/SLSA, verified with `gh attestation verify`
# Implemented in pages.yml `attest` job: actions/attest-build-provenance with
# subject-path: site.tar.gz (attestations: write + id-token: write); verified
# by deploy-gate.yml with `gh attestation verify --signer-workflow` and
# re-verifiable by anyone: `gh attestation verify site.tar.gz --repo p4gs/p4gs.github.io`.
[controls.github-attestations]
enabled = true

# GitHub SBOM attestation: GitHub-native SBOM attestation bound to the artifact digest (actions/attest, sbom-path) — additive, verified with `gh attestation verify`
# Implemented in pages.yml: the `build` job generates a CycloneDX SBOM of the
# tree that produced site.tar.gz (anchore/sbom-action, path: site) and the
# `attest` job binds it to the archive digest with actions/attest (sbom-path);
# deploy-gate.yml verifies it with `--predicate-type https://cyclonedx.org/bom`.
[controls.sbom-attestation]
enabled = true

# OpenSSF Model Signing: Sign & verify ML model artifacts with Sigstore keyless signing; applies when models are present (off by default)
[controls.model-signing]
enabled = false

# Provenance verification gates: slsa-verifier + cosign verification required before promote/deploy/publish
# Implemented as .github/workflows/deploy-gate.yml — a `workflow_call` gate
# that pages.yml runs between provenance and deploy-pages. It re-checks the
# archive digest, then `cosign verify-blob --bundle`, `gh attestation verify`
# (build provenance AND SBOM), and `slsa-verifier verify-artifact --builder-id`
# must ALL pass before the verified bytes become the Pages artifact. The
# builder_id below is the same one the gate is handed; `sscsb provenance
# verify` uses it too, so a downloaded site.tar.gz can be re-verified locally.
[controls.provenance-verify]
enabled = true
builder_id = "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0"

# Immutable releases (draft-then-publish): Draft-then-publish release.yml so assets attach before publish — compatible with GitHub release immutability (Settings -> Releases); opt-in, supersedes the modular release-sign/slsa flow
# Disabled: this repo publishes NO GitHub releases — the deployable is the
# Pages deployment (pages.yml), so there is no release to make immutable and
# a draft-then-publish release.yml would be a workflow that never fires.
[controls.release-immutability]
enabled = false

# Octo STS federation: Short-lived repo-scoped GitHub credentials replacing long-lived PATs
# Implemented: .github/workflows/directory-publish.yml mints its PR-opening
# token by OIDC federation (octo-sts/action, identity `directory-publish`,
# policy .github/chainguard/directory-publish.sts.yaml — contents: write +
# pull_requests: write, restricted to that workflow's job_workflow_ref) with
# the long-lived DIRECTORY_BOT_KEY App key as fallback until the Octo STS App
# is installed on the repo. .github/workflows/octo-sts-example.yml is the
# read-only federation probe for .github/chainguard/sscsb-automation.sts.yaml.
[controls.octo-sts]
enabled = true

# Harden-Runner: StepSecurity Harden-Runner egress/tamper monitoring in every workflow
[controls.harden-runner]
enabled = true

# Witness (optional): Richer in-toto attestation capture and policy around build steps
[controls.witness]
enabled = false

# ── Phase 4 — Deeper code security & CI hardening ──

# SAST (OpenGrep default): OpenGrep rule-driven SAST in pre-commit and CI; Semgrep selectable
[controls.sast]
enabled = true
engine = "opengrep"
pre_commit = false
rules = ".sscsb/rules"

# Sighthound (optional): Ultra-fast local pre-commit SAST layer
[controls.sighthound]
enabled = false

# CodeQL: Deep interprocedural analysis on PRs and default branch
[controls.codeql]
enabled = true

# ClusterFuzzLite fuzzing: Continuous fuzzing on PRs (cargo-fuzz + ClusterFuzzLite) — the OpenSSF-Scorecard Rust fuzzing probe; opt-in (needs project fuzz targets)
[controls.fuzzing]
enabled = false

# Extended workflow audit: pull_request_target misuse, credential persistence, secret echo, risky actions
[controls.workflow-audit-extended]
enabled = true

# StepSecurity secure-repo: Onboarding accelerator via app.stepsecurity.io (web service, not an action)
[controls.secure-repo]
enabled = true

# wait-for-secrets (optional): Human-in-the-loop secret injection for high-sensitivity workflows
[controls.wait-for-secrets]
enabled = false

# ── Phase 5 — Observability & governance ──

# Dependency-Track: Continuous SBOM management platform (self-hosted); sscsb uploads BOMs
[controls.dependency-track]
enabled = false
url = ""
project_name = ""

# GUAC ingestion: Supply-chain knowledge graph over SBOMs, attestations, and VEX
[controls.guac]
enabled = false

# OpenVEX: Generate and ingest VEX for exploitability-aware triage
[controls.openvex]
enabled = true

# ORAS OCI storage (optional): Push SBOMs/attestations to an OCI registry as reference artifacts
[controls.oras]
enabled = false

# OpenSSF Security Insights: Machine-readable security-insights.yml declaring the project's security practices and reporting channels
[controls.security-insights]
enabled = true

# OpenSSF Best Practices Badge helper: Worksheet pre-filling the passing-badge criteria from installed controls (lifts Scorecard's CII check)
[controls.best-practices-badge]
enabled = true

# OSPS Baseline assessment: Maps enabled controls to OpenSSF Project Security Baseline families and adds an OSPS column to `sscsb report`
[controls.osps-baseline]
enabled = true

# Compliance map & report: Machine-readable control → SLSA/SSDF/CRA/OSPS/Badge map behind `sscsb report`
[controls.compliance-map]
enabled = true

