# Directory collect: the PAT-free submission lane for authenticated scans.
#
# sscsb-action's `submit: "true"` files the submission issue from the scanned
# repository's CI, which needs a cross-repo token — a long-lived secret every
# participating repo would have to hold. This workflow inverts the flow: repos
# opt in by PR to site/data/registry.json, and the directory itself polls each
# one for its latest successful `sscsb-scan.yml` run on the default branch,
# files (or refreshes) the `[action-scan] OWNER/REPO` issue with THIS repo's
# own GITHUB_TOKEN, and dispatches directory-ingest.yml for it. Nobody holds
# anybody else's credentials; trust rides the record's signature, which the
# ingest verifies exactly as for a hand-filed submission.
#
# Why the explicit dispatch: events caused by GITHUB_TOKEN never trigger
# `issues` workflows (GitHub's anti-recursion rule); workflow_dispatch is the
# documented exception, and directory-ingest.yml accepts an issue number.
name: Directory collect (registered action results)
on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: directory-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # registry file
      issues: write # file / refresh submission issues in THIS repo
      actions: write # dispatch directory-ingest.yml
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Discover, submit, and dispatch ingest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          submitted=0; skipped=0
          while IFS= read -r slug; do
            [ -n "$slug" ] || continue
            # Registry entries are maintainer-reviewed, but validate anyway:
            # this string reaches API paths.
            if ! printf '%s' "$slug" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}$'; then
              echo "::warning::registry entry '$slug' is not a valid owner/repo — skipped"; continue
            fi
            echo "== $slug"
            default_branch=$(gh api "repos/$slug" --jq .default_branch 2>/dev/null || true)
            if [ -z "$default_branch" ]; then echo "   unreachable — skipped"; skipped=$((skipped+1)); continue; fi
            run_json=$(gh api "repos/$slug/actions/workflows/sscsb-scan.yml/runs?status=success&branch=$default_branch&per_page=1" 2>/dev/null \
              --jq '.workflow_runs[0] | {id, head_sha}' || true)
            run_id=$(printf '%s' "$run_json" | jq -r '.id // empty')
            head_sha=$(printf '%s' "$run_json" | jq -r '.head_sha // empty')
            if [ -z "$run_id" ]; then echo "   no successful sscsb-scan.yml run on $default_branch — skipped"; skipped=$((skipped+1)); continue; fi
            has_artifact=$(gh api "repos/$slug/actions/runs/$run_id/artifacts" \
              --jq '[.artifacts[] | select(.name=="sscsb-scan-record" and .expired==false)] | length')
            if [ "$has_artifact" = "0" ]; then echo "   run $run_id has no unexpired sscsb-scan-record artifact — skipped"; skipped=$((skipped+1)); continue; fi

            title="[action-scan] $slug"
            # Match the exact title client-side — GitHub search treats
            # brackets loosely, so the search hit alone is never trusted.
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label action-scan-result --state open \
              --limit 500 --json number,title,body \
              --jq --arg t "$title" '[.[] | select(.title == $t)][0] // empty')
            existing_num=$(printf '%s' "$existing" | jq -r '.number // empty')
            if [ -n "$existing_num" ] && printf '%s' "$existing" | jq -r .body | grep -qE "Workflow run ID[^0-9]*${run_id}\b"; then
              echo "   issue #$existing_num already carries run $run_id — nothing new"; skipped=$((skipped+1)); continue
            fi

            body="$RUNNER_TEMP/body-$$.md"
            {
              echo "Authenticated sscsb scan record collected by the directory's registry poll (\`directory-collect.yml\`) from the repository's own public CI run."
              echo
              echo "- Repository: \`${slug}\`"
              echo "- Head SHA: \`${head_sha}\`"
              echo "- Workflow run ID: \`${run_id}\`"
              echo "- Workflow run: ${GITHUB_SERVER_URL}/${slug}/actions/runs/${run_id}"
              echo "- Artifact: \`sscsb-scan-record\` (contains \`scan-record.json\`)"
              echo "- Signed: determined at ingest (the bundle, when present, is verified against this repository's workflow identity)"
              echo
              echo "The directory pipeline fetches the artifact from the public run above and routes it through the same maintainer publish gate as every other scan. The record JSON itself is never carried in this issue body."
            } > "$body"
            if [ -n "$existing_num" ]; then
              gh issue edit "$existing_num" --repo "$GITHUB_REPOSITORY" --body-file "$body"
              issue="$existing_num"
              echo "   refreshed issue #$issue with run $run_id"
            else
              url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label action-scan-result --body-file "$body")
              issue="${url##*/}"
              echo "   filed issue #$issue for run $run_id"
            fi
            # GITHUB_TOKEN-caused issue events do not trigger workflows; dispatch explicitly.
            gh workflow run directory-ingest.yml --repo "$GITHUB_REPOSITORY" -f "issue=$issue"
            submitted=$((submitted+1))
          done < <(jq -r '.repos[]' site/data/registry.json)
          echo "submitted=$submitted skipped=$skipped" | tee -a "$GITHUB_STEP_SUMMARY"
