# Authenticated-scan ingest: fetch a scan record that sscsb-action produced in
# the TARGET repository's own CI, revalidate it, and summarize on the issue.
# Publication still requires the maintainer `publish` label — the record then
# flows through directory-publish.yml exactly like an external scan (that
# workflow prefers a local scan-record artifact for the issue and falls back
# to this ingest's re-uploaded copy).
#
# Trust note: the record comes from the submitter's own public run. We treat it
# as a CLAIM — schema-validated, slug-matched against the issue, size-capped —
# and label the listing as action-submitted; the human publish gate stays.
name: Directory ingest (action results)
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: read

concurrency:
  group: directory-ingest-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  ingest:
    if: contains(github.event.issue.labels.*.name, 'action-scan-result')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install site deps
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Parse request
        id: req
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ github.token }}
        run: bun run site/src/scan/parse-request.ts
      - name: Fetch the record from the submitter's public run
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.req.outputs.slug }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          # Issue-form answers land on the line AFTER their heading, so flatten
          # newlines before matching; `|| true` keeps set-e from killing the
          # assignment on no-match so the guard below can report it properly.
          run_id=$(printf '%s' "$ISSUE_BODY" | tr '\n' ' ' | grep -oE 'Workflow run ID[^0-9]*[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
          [ -n "$run_id" ] || { echo "::error::no run ID found in the issue"; exit 1; }
          artifact_id=$(gh api "repos/$SLUG/actions/runs/$run_id/artifacts" \
            --jq '.artifacts[] | select(.name=="sscsb-scan-record") | .id' | head -1)
          [ -n "$artifact_id" ] || { echo "::error::run $run_id has no sscsb-scan-record artifact"; exit 1; }
          size=$(gh api "repos/$SLUG/actions/runs/$run_id/artifacts" \
            --jq '.artifacts[] | select(.name=="sscsb-scan-record") | .size_in_bytes' | head -1)
          [ "$size" -le 1048576 ] || { echo "::error::artifact is ${size}B — cap is 1 MB"; exit 1; }
          gh api "repos/$SLUG/actions/artifacts/$artifact_id/zip" > record.zip
          unzip -o record.zip scan-record.json
      - name: Revalidate against the request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          RECORD_PATH: scan-record.json
        run: bun run site/src/scan/validate-record.ts
      - name: Re-upload under this issue (for directory-publish.yml)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-record-${{ github.event.issue.number }}
          path: scan-record.json
          if-no-files-found: error
          retention-days: 30

  comment:
    needs: [ingest]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install site deps
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Download record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scan-record-${{ github.event.issue.number }}
      - name: Render summary
        env:
          RECORD_PATH: scan-record.json
          COMMENT_PATH: scan-comment.md
        run: bun run site/src/scan/render-comment.ts
      - name: Post comment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file scan-comment.md
