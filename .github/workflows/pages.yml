# Site deploy: site/data + templates → static HTML → GitHub Pages.
#
# Serves at tools.sensiblesecurity.xyz/sscs-bootstrapper/ (the custom domain
# lives on the p4gs user site; project sites path-route under it). The repo's
# Pages source must be set to "GitHub Actions" or deploy-pages fails.
#
# The deploy IS this repo's release. There are no GitHub releases — the only
# artifact that ships is the Pages deployment — so the provenance controls
# that a release pipeline would hang off tags hang off the deployable here:
#
#   build       bun build → site.tar.gz (the exact bytes that will deploy) +
#               CycloneDX SBOM of the tree that produced it
#   attest      GitHub build-provenance attestation, SBOM attestation, and a
#               Cosign keyless signature — all bound to site.tar.gz's digest
#   provenance  SLSA Build L3 provenance from the slsa-github-generator
#               trusted builder over that same digest
#   gate        .github/workflows/deploy-gate.yml verifies ALL THREE trails
#               (cosign verify-blob, gh attestation verify ×2, slsa-verifier)
#               and only then unpacks the verified archive as the Pages artifact
#   deploy      actions/deploy-pages — unreachable unless the gate passed
#
# Consumers can re-verify what is live: the run's `site-archive` +
# `site-signature` artifacts and `gh attestation verify site.tar.gz --repo
# p4gs/p4gs.github.io`.
#
# Proving the graph without deploying: `workflow_dispatch` on ANY branch runs
# build → attest + provenance → gate for that branch's ref (the signing
# identity, attestation subject and SLSA source-branch all follow
# GITHUB_REF, so every verifier is exercised for real). Only `deploy` is
# guarded to refs/heads/main — the `github-pages` environment would reject a
# non-main deploy anyway, and this makes that explicit rather than incidental.
#
# Dogfooding: this workflow must itself pass `sscsb verify actions-audit` —
# SHA-pinned, least-privilege, harden-runner first. Write permissions are
# per-job and only the ones each step needs. The one tag-pinned reference is
# the slsa-github-generator reusable workflow, BY DESIGN: slsa-verifier
# validates the trusted builder's ref and the build fails on SHA or short-tag
# refs (upstream README; slsa-verifier issue #12).
name: Deploy site
on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/deploy-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time; never cancel a deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # sha256 of site.tar.gz — every later job re-checks the bytes it
      # downloaded against this before signing, attesting, or verifying.
      sha256: ${{ steps.hash.outputs.sha256 }}
      # `sha256sum` line, base64 — the slsa-github-generator subject format.
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install, typecheck, test, build
        working-directory: site
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun test
          bun run build
      # The deployable, as one file with one digest. Deterministic packing
      # (sorted entries, zeroed ownership, commit-time mtimes, no gzip
      # timestamp) so the same commit packs to the same digest on a rebuild.
      # Fails EXPLICITLY on an empty build: "there was nothing to package"
      # must never turn into a signed, attested, deployed empty site.
      - name: Package the deployable (site.tar.gz)
        run: |
          set -euo pipefail
          if [ ! -s site/dist/index.html ]; then
            echo "::error::site/dist/index.html is missing or empty — the build produced no site"
            exit 1
          fi
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@${SOURCE_DATE_EPOCH}" \
            -C site/dist -cf - . | gzip -n > site.tar.gz
          ls -l site.tar.gz
      - name: Compute the subject digest
        id: hash
        run: |
          set -euo pipefail
          sha256sum site.tar.gz
          echo "sha256=$(sha256sum site.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "hashes=$(sha256sum site.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"
      # SBOM of the tree that PRODUCED the deployable (site/: package.json,
      # bun.lock, the installed toolchain in node_modules). The site itself
      # ships no runtime dependencies; the SBOM describes its build inputs.
      # Generated here, in the job that holds the installed tree, and
      # attested to the archive's digest in the `attest` job below.
      - name: Generate CycloneDX SBOM of the build tree
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: site
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Refuse to ship without an SBOM
        run: |
          set -euo pipefail
          if [ ! -s sbom.cdx.json ]; then
            echo "::error::sbom.cdx.json is missing or empty — nothing to attest"
            exit 1
          fi
      - name: Upload archive + SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-archive
          path: |
            site.tar.gz
            sbom.cdx.json
          if-no-files-found: error

  # Three independent provenance trails over the SAME digest, from a job that
  # did not build (the download is re-checked against build's digest first):
  #   1. GitHub build-provenance attestation  (gh attestation verify)
  #   2. GitHub SBOM attestation              (gh attestation verify --predicate-type)
  #   3. Cosign keyless signature + Rekor     (cosign verify-blob --bundle)
  attest:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless signing + attestation (Fulcio/Sigstore OIDC)
      attestations: write # write build-provenance + SBOM to the attestation store
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Download archive + SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-archive
      # Never sign or attest bytes other than the ones `build` hashed. The
      # expected digest reaches the shell through the ENVIRONMENT, never by
      # `${{ }}` interpolation into the script body — the rule sscsb enforces.
      - name: Refuse to attest a different archive than build produced
        env:
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          actual="$(sha256sum site.tar.gz | cut -d' ' -f1)"
          if [ -z "$EXPECTED" ] || [ "$actual" != "$EXPECTED" ]; then
            echo "::error::site.tar.gz digest $actual does not match build's $EXPECTED"
            exit 1
          fi
      - name: Attest build provenance (attestation store)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: site.tar.gz
      - name: Attest the SBOM to the artifact digest (attestation store)
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: site.tar.gz
          sbom-path: sbom.cdx.json
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless sign the archive (bundle = cert + sig + Rekor proof)
        run: |
          set -euo pipefail
          cosign sign-blob site.tar.gz --bundle site.tar.gz.sigstore.json --yes
      - name: Upload signature bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-signature
          path: site.tar.gz.sigstore.json
          if-no-files-found: error

  # SLSA Build L3: provenance is generated and signed by the slsa-github-
  # generator's isolated trusted builder, not by this workflow, over the
  # digest `build` computed. No release exists to attach it to, so it stays
  # a run artifact (`upload-assets: false`) that the gate downloads and
  # verifies. Tag-pinned BY DESIGN — see header comment.
  provenance:
    needs: [build]
    permissions:
      actions: read # workflow context for provenance
      id-token: write # sign provenance (Fulcio)
      contents: write # declared by the generator's (skipped) release-upload job; the caller must grant a superset
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      # v2.1.0 contract: base64-subjects = base64 of the `sha256sum` line(s)
      # (build's `hashes` output); upload-assets: false = no release to
      # attach to; provenance-name = the artifact name AND filename of the
      # signed provenance (the generator uploads with name == path), which
      # is what `gate` downloads and hands slsa-verifier. Named explicitly
      # so the gate never depends on the generator's default naming.
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: false
      provenance-name: site.tar.gz.intoto.jsonl

  # The gate: deploy is unreachable unless every trail verified. The
  # implementation lives in deploy-gate.yml (the provenance-verify control's
  # artifact) so there is one gate, not a copy of one.
  gate:
    needs: [build, attest, provenance]
    permissions:
      contents: read
      attestations: read # fetch attestations via the API
    uses: ./.github/workflows/deploy-gate.yml
    with:
      archive-artifact: site-archive
      archive: site.tar.gz
      archive-sha256: ${{ needs.build.outputs.sha256 }}
      signature-artifact: site-signature
      provenance-artifact: ${{ needs.provenance.outputs.provenance-name }}
      # BUILDER_ID must track the generator pinned in the `provenance` job
      # above — change one, change the other.
      builder-id: https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0
      signer-workflow: .github/workflows/pages.yml

  deploy:
    needs: [gate]
    # Main only. A branch dispatch proves build → attest → provenance → gate
    # end to end and stops here; nothing but a verified main build deploys.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write # the deployment itself
      id-token: write # Pages OIDC deployment verification
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
