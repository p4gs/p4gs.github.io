# Directory publish: a maintainer's `publish` label turns a completed scan
# into a bot PR adding the record to site/data/repos/.
#
# Why not GITHUB_TOKEN: events caused by GITHUB_TOKEN do not trigger
# `pull_request` workflows, and main requires PR checks — a GITHUB_TOKEN-
# created PR would sit unmergeable. The PR token is therefore an App token
# (contents: write + pull_requests: write on this repo only), minted one of
# two ways, in this order:
#   1. Octo STS federation — this job's OIDC identity is exchanged for a ~1h
#      token under .github/chainguard/directory-publish.sts.yaml. Nothing
#      stored, nothing to rotate. Needs the Octo STS App installed here.
#   2. Fallback: the dedicated directory-bot App, whose private key lives in
#      the DIRECTORY_BOT_KEY secret — the long-lived credential (1) retires.
#      Delete the secret once federated publishes are observed working.
#
# Three independent gates against artifact poisoning:
#   1. the artifact comes only from a successful directory-scan.yml run in
#      THIS repo for THIS issue;
#   2. the record revalidates against the schema and the issue's parsed slug
#      (and, for signed authenticated-lane records, its Sigstore bundle was
#      verified at ingest against the producing workflow's identity);
#   3. the result is a PR into a protected branch whose only remaining gate
#      is the required `site` check — the human review is the label itself,
#      so the PR is opened with auto-merge armed (squash; GitHub signs the
#      resulting commit, which main's required-signatures rule demands).
# Plus: the labeler's write+ permission is re-checked via the collaborators
# API — belt and braces over GitHub's own triage-role requirement for labels.
#
# Repo prerequisite for the auto-merge: Settings → General → "Allow
# auto-merge" must be on, or `gh pr merge --auto` is refused — the PR still
# exists, the step (and run) fails visibly, and a maintainer merges by hand.
name: Directory publish
on:
  issues:
    types: [labeled]

permissions:
  contents: read

# One publish at a time, repo-wide: main's ruleset has strict required
# status checks, and GitHub auto-merge does not update an out-of-date PR
# branch — two publish PRs racing each other would leave the loser stalled
# behind the winner's merge. Serialising here means each PR is created
# against the main that exists when it is created.
concurrency:
  group: directory-publish-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.label.name == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # locate + download the scan artifact
      issues: write # confirmation / failure comment
      id-token: write # exchange OIDC identity for the Octo STS publish token
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Verify labeler authority
        id: auth
        env:
          ACTOR: ${{ github.event.sender.login }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Two legitimate labelers: a maintainer (write+), or the directory's
          # own auto-publish gate acting as the Octo STS federated identity.
          # The bot's label is NOT trusted on its own — it is authorized below
          # against the ingested trust sidecar and the registry, so a bot
          # label on anything unsigned, unregistered, or off-lane still fails.
          if [ "$ACTOR" = "octo-sts[bot]" ]; then
            echo "label applied by $ACTOR — deferring to the trust-sidecar authorization step"
            echo "bot_label=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          case "$perm" in
            admin|maintain|write) echo "labeler $ACTOR has $perm"; echo "bot_label=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::label applied by $ACTOR ($perm) — publish requires write+"; exit 1 ;;
          esac
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install site deps
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Locate latest successful scan run for this issue
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # All three lanes upload scan-record-<issue>: external scans from
          # directory-scan.yml, authenticated and local submissions via
          # directory-ingest.yml (its `ingest` and `ingest_local` jobs).
          run_id=$( (gh api "repos/$GITHUB_REPOSITORY/actions/workflows/directory-scan.yml/runs?status=success&per_page=50" \
            --jq ".workflow_runs[].id"; \
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/directory-ingest.yml/runs?status=success&per_page=50" \
            --jq ".workflow_runs[].id") | while read -r id; do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                   --jq ".artifacts[].name" | grep -qx "scan-record-$ISSUE"; then
                echo "$id"; break
              fi
            done)
          [ -n "$run_id" ] || { echo "::error::no successful scan run with an artifact for issue #$ISSUE"; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download scan record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scan-record-${{ github.event.issue.number }}
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Revalidate record against the request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          RECORD_PATH: scan-record.json
        run: |
          set -euo pipefail
          bun run site/src/scan/validate-record.ts
      - name: Authorize a bot-applied label against the trust sidecar
        if: steps.auth.outputs.bot_label == 'true'
        env:
          ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -s scan-record.trust.json ] || { echo "::error::bot-applied label but no trust sidecar was ingested — refusing"; exit 1; }
          lane=$(jq -r '.lane // ""' scan-record.trust.json); sig=$(jq -r '.signature // ""' scan-record.trust.json)
          identity=$(jq -r '.identity // ""' scan-record.trust.json)
          slug=$(jq -r '"\(.repo.owner)/\(.repo.name)"' scan-record.json)
          in_registry=$(jq -r --arg s "$slug" '[.repos[] | ascii_downcase] | index($s | ascii_downcase) != null' site/data/registry.json)
          reason=""
          [ "$lane" = "action" ] || reason="lane '$lane' is not the authenticated action lane"
          [ -n "$reason" ] || [ "$sig" = "verified" ] || reason="signature is '$sig', not verified"
          [ -n "$reason" ] || [[ "$identity" == *"github.com/${slug}/.github/workflows/sscsb-scan.yml@"* ]] || reason="verified identity is not ${slug}'s canonical sscsb-scan.yml"
          [ -n "$reason" ] || [ "$in_registry" = "true" ] || reason="${slug} is not in site/data/registry.json"
          if [ -n "$reason" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Publish refused a bot-applied label: ${reason}. A maintainer must apply \`publish\` by hand if this record should be listed."
            echo "::error::bot label not authorized: $reason"; exit 1
          fi
          echo "bot label authorized: $slug — lane=$lane signature=$sig registry=yes"
      # Preferred: federate. A failure here (App not installed yet, policy
      # rejected) is logged and the fallback below carries the publish; it
      # never lets an unauthenticated push proceed — the push step has no
      # token at all if BOTH mints fail.
      - name: Mint publish token (Octo STS federation)
        id: octo-sts
        continue-on-error: true
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: p4gs/p4gs.github.io
          identity: directory-publish
      - name: Mint publish token (directory-bot App fallback)
        id: app
        if: steps.octo-sts.outcome != 'success'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DIRECTORY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DIRECTORY_BOT_KEY }}
      - name: Branch, commit record, open PR
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token || steps.app.outputs.token }}
          TOKEN_SOURCE: ${{ steps.octo-sts.outcome == 'success' && 'octo-sts' || 'directory-bot-app' }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::no publish token — Octo STS federation and the App fallback both failed"
            exit 1
          fi
          echo "publish token source: $TOKEN_SOURCE"
          slug=$(bun -e 'const r = await Bun.file("scan-record.json").json(); console.log(`${r.repo.owner.toLowerCase()}--${r.repo.name.toLowerCase()}`)')
          human=$(bun -e 'const r = await Bun.file("scan-record.json").json(); console.log(`${r.repo.owner}/${r.repo.name}`)')
          grade=$(bun -e 'const r = await Bun.file("scan-record.json").json(); console.log(r.score.grade)')
          branch="directory/${slug}"
          # Commits are created through the GitHub API, never `git commit` on
          # the runner: main requires verified signatures and the bot holds no
          # signing key (humans, CI and bots never share identities). GitHub
          # signs API-created commits itself and attributes them to the App
          # identity that made them, which is exactly the provenance we want.
          base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" -f sha="$base" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$base" >/dev/null
          fi
          put_file() { # <repo path> <local file> <commit message>
            local path="$1" src="$2" msg="$3" sha
            sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$branch" --jq .sha 2>/dev/null || true)
            jq -n --arg m "$msg" --arg b "$branch" --arg c "$(base64 < "$src" | tr -d '\n')" --arg s "$sha" \
              '{message:$m, branch:$b, content:$c} + (if $s != "" then {sha:$s} else {} end)' \
              | gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$path" --input - >/dev/null
          }
          lane=$([ -s scan-record.trust.json ] && jq -r '.lane // ""' scan-record.trust.json || echo "")
          if [ "$lane" = "local" ]; then
            # LOCAL LANE. A workstation record never replaces the repo-observable
            # record: it lands in its own directory, and the site build MERGES it
            # with whatever base record exists (site/src/reclassify.ts
            # mergeEvidence) — every source votes, a disagreement scores a gap
            # with a named contradiction, and a local claim about anything a
            # repository scan could observe is held back until an independent
            # record agrees. Writing it to site/data/repos/ instead would let a
            # maintainer's machine overwrite their CI's verdicts, which is the
            # one thing this lane must never be able to do.
            put_file "site/data/local/${slug}.json" scan-record.json "directory: local scan record for ${human} (issue #${ISSUE})"
            put_file "site/data/trust/${slug}.local.json" scan-record.trust.json "directory: local trust sidecar for ${human} (issue #${ISSUE})"
            put_file "site/data/trust/${slug}.local.sig" scan-record.local.sig "directory: local scan signature for ${human} (issue #${ISSUE})"
          else
            put_file "site/data/repos/${slug}.json" scan-record.json "directory: publish ${human} (grade ${grade}, issue #${ISSUE})"
            # Authenticated-lane submissions carry a trust sidecar (and, when
            # signed, the Sigstore bundle) from directory-ingest.yml. Publish
            # them beside the record so the listing can show provenance and
            # anyone can re-verify. External scans have neither — by construction.
            if [ -s scan-record.trust.json ]; then
              put_file "site/data/trust/${slug}.json" scan-record.trust.json "directory: trust sidecar for ${human} (issue #${ISSUE})"
              if [ -s scan-record.json.sigstore.json ]; then
                put_file "site/data/trust/${slug}.sigstore.json" scan-record.json.sigstore.json "directory: Sigstore bundle for ${human} (issue #${ISSUE})"
              fi
            fi
          fi
          existing=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "reusing open PR #$existing for $branch"
          else
            gh pr create --head "$branch" \
              --title "directory: publish ${human} (${grade})" \
              --body "Adds the reviewed scan record for \`${human}\` from issue #${ISSUE}. The \`site\` CI job validates the record; merging deploys the directory."
          fi
          # Auto-merge on green. The REVIEW already happened before this job
          # ran: a maintainer with write+ applied the `publish` label (checked
          # above), or the record arrived through the verified authenticated
          # lane (directory-ingest.yml verified its Sigstore bundle at ingest).
          # The only gate left is main's required `site` check, so the PR
          # merges itself once that check is green. Strict checks mean a PR
          # whose base moved before merge is out of date and auto-merge will
          # not update it, so the loop below brings it up to date (the App
          # identity holds contents: write) until it merges. Squash so the commit that lands on
          # main is created — and signed — by GitHub, satisfying main's
          # required-signatures rule. Same token as the PR: the App identity
          # holds pull_requests: write, the minimum that enables auto-merge.
          gh pr merge --auto --squash "$branch"
          # Concurrent publishes race each other onto main; each time this PR
          # falls behind, update its branch so the required check re-runs and
          # auto-merge can complete. Bounded: ~8 minutes, then leave auto-merge
          # armed and report.
          n=$(gh pr view "$branch" --json number --jq .number)
          for i in $(seq 1 32); do
            st=$(gh pr view "$n" --json state,mergeStateStatus --jq '.state + " " + .mergeStateStatus')
            case "$st" in
              MERGED*) echo "PR #$n merged"; break ;;
              *BEHIND*) echo "PR #$n is behind main — updating branch"; gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$n/update-branch" >/dev/null || true ;;
            esac
            sleep 15
          done
          echo "final: $(gh pr view "$n" --json state,mergeStateStatus --jq '.state + " " + .mergeStateStatus')"
      # No silent, unmergeable outcome: when BOTH identities failed to mint,
      # say so on the issue the maintainer is watching, not only in run logs.
      - name: Report on the issue when no publish token could be minted
        if: failure() && steps.octo-sts.outcome != 'success' && steps.app.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Publish did not run: no publish token could be minted — Octo STS federation failed (is the Octo STS App installed on this repo?) and the directory-bot App fallback failed too (DIRECTORY_BOT_CLIENT_ID / DIRECTORY_BOT_KEY). Nothing was pushed and no PR was opened. Run: $RUN_URL — re-apply the \`publish\` label after fixing either identity."
      - name: Confirm on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Publish PR opened with auto-merge armed — it merges itself when the required \`site\` check is green, and the listing goes live on the deploy that follows."
