# sscsb: CI secret-scanning backstop (TruffleHog + Gitleaks).
# Local hooks block first; this catches anything that slips past (e.g. web UI commits).
# TruffleHog + Gitleaks, alongside each other (owner decision 2026-10-06): TruffleHog
# live-validates candidate credentials against the issuing provider, so a verified finding
# means an ACTIVE secret — but its --results=verified,unknown filter drops generic and
# unverifiable secrets it cannot confirm with a provider. Gitleaks' regex/entropy matching
# catches that class instead, so both scanners run rather than one replacing the other.
# All actions pinned to full commit SHAs (sscsb actions-audit enforces this).
name: Secret Scan
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout (full history for diff scanning)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Upstream README suggests @main; sscsb pins the release SHA instead (v3.95.9).
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --results=verified,unknown

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Organizations need a license; personal accounts do not:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
